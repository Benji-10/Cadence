[build]
  command = "prisma db push --accept-data-loss && next build"
  publish = ".next"

[build.environment]
  NEXT_USE_NETLIFY = "true"
  # Set DATABASE_URL in the Netlify dashboard → Site settings → Environment variables
  # Use the Neon POOLED connection string (host contains "-pooler"):
  # postgresql://USER:PASS@ep-xxxxx-pooler.REGION.aws.neon.tech/DBNAME?sslmode=require&pgbouncer=true&connect_timeout=15

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The Next.js plugin handles all routing automatically.
# Files in /public (_headers, _redirects) are served as static assets.
