[build]
  command = "prisma db push --accept-data-loss && next build"
  publish = ".next"

[build.environment]
  NEXT_USE_NETLIFY = "true"
  # Set these in the Netlify dashboard → Site settings → Environment variables:
  # DATABASE_URL                    — Neon pooled connection string
  # NEXT_PUBLIC_VAPID_PUBLIC_KEY    — VAPID public key (from `npx web-push generate-vapid-keys`)
  # VAPID_PRIVATE_KEY               — VAPID private key (server-only)
  # CRON_SECRET                     — shared secret for the check-alerts function
  #                                   (GitHub Actions sends this in the x-api-key header)

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Functions ────────────────────────────────────────────────────────────────
# `check-alerts` is now an ON-DEMAND function (no `schedule` key). It is
# triggered every 5 minutes by the GitHub Actions workflow in
# `.github/workflows/cron.yml`, which `curl`s the function URL with the
# `x-api-key` header. This is more portable than Netlify's native scheduler
# and keeps the schedule in version control.
[functions]
  directory = "netlify/functions"
