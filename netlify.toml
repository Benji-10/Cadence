[build]
  command = "prisma db push --accept-data-loss && next build"
  publish = ".next"

[build.environment]
  NEXT_USE_NETLIFY = "true"
  # Set these in the Netlify dashboard → Site settings → Environment variables:
  # DATABASE_URL                    — Neon pooled connection string
  # NEXT_PUBLIC_VAPID_PUBLIC_KEY    — VAPID public key (from `npx web-push generate-vapid-keys`)
  # VAPID_PRIVATE_KEY               — VAPID private key (server-only)

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Scheduled Functions ────────────────────────────────────────────────────
[functions]
  directory = "netlify/functions"

[functions."check-alerts"]
  schedule = "*/15 * * * *"
