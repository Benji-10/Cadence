[build]
  command = "prisma db push --accept-data-loss && next build"
  publish = ".next"

[build.environment]
  NEXT_USE_NETLIFY = "true"
  # Set these in the Netlify dashboard → Site settings → Environment variables:
  # DATABASE_URL                    — Neon pooled connection string
  # NEXT_PUBLIC_VAPID_PUBLIC_KEY    — VAPID public key (from `npx web-push generate-vapid-keys`)
  # VAPID_PRIVATE_KEY               — VAPID private key (server-only)

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Scheduled Functions ────────────────────────────────────────────────────
[functions]
  directory = "netlify/functions"

# Every 5 minutes (was 15). The alert-checker uses a look-back window so it
# never misses an event that started between runs. 5-min cadence caps the
# closed-PWA notification latency at ~5 min instead of ~15 min.
# Free-tier budget: 5 * 24 * 30 = 3,600 invocations/month (well under the
# 125,000-function-call limit on Netlify's free tier).
[functions."check-alerts"]
  schedule = "*/5 * * * *"
